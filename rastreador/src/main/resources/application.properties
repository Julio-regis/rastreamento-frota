# Conexão com o seu banco MySQL (banco: coleta)
spring.datasource.url=jdbc:mysql://localhost:3306/coleta?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Coloque a sua senha do MySQL Workbench na linha abaixo:
spring.datasource.password=julio

# Driver do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Força o Hibernate a criar as tabelas automaticamente no MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect